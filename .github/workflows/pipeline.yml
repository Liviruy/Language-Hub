name: Language Hub Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/raw/*.csv'
      - 'data/raw/*.json'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        run: python scripts/init_database.py

      - name: Import new words
        run: |
          for f in data/raw/*.csv; do
            if [ -f "$f" ]; then
              echo "Importing: $f"
              python scripts/import_words.py "$f"
            fi
          done
          for f in data/raw/*.json; do
            if [ -f "$f" ]; then
              echo "Importing: $f"
              python scripts/import_words.py "$f"
            fi
          done

      - name: Dictionary enrichment
        run: python scripts/dictionary_pipeline.py

      - name: Generate audio
        run: python scripts/generate_audio.py

      - name: Export Anki decks
        run: python scripts/export_anki.py

      - name: Upload assets to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/upload_r2.py

      - name: Export words.json
        run: python scripts/export_words.py

      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/words.json
          if ! git diff --staged --quiet; then
            git commit -m 'auto: update words.json'
            git push
          fi
